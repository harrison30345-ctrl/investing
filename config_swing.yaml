# ─────────────────────────────────────────────────────────────
# Swing trading screener config
# "Not garbage" filter: fundamentally sound, loose thresholds
# Use this to filter OUT broken companies before layering
# your own technical analysis on the survivors.
# ─────────────────────────────────────────────────────────────

filters:

  # ── Profitability — must be profitable ──
  net_margin:
    enabled: true
    min: 0
    on_missing: fail   # If we can't confirm profitability, skip it

  # ── Financial health — not over-leveraged ──
  debt_to_equity:
    enabled: true
    max: 2.0
    on_missing: pass

  # ── Growth — revenue not shrinking ──
  revenue_growth_1y:
    enabled: true
    min: 0
    on_missing: pass

  # ── Cash flow — actually generating cash ──
  fcf:
    enabled: true
    min: 0
    on_missing: fail   # Cash-burning companies gap down on earnings


# ─────────────────────────────────────────────────────────────
# Scoring — same weights, used to rank the survivors
# ─────────────────────────────────────────────────────────────
scoring:
  weights:
    profitability: 0.30
    financial_health: 0.25
    valuation: 0.20
    growth: 0.15
    cash_flow: 0.10

cache:
  expiry_hours: 24

[metadata]
name = stock-screener
version = 1.0.0
description = Fundamental stock screener for long-term investing and swing trading prep

[options]
packages = find:
python_requires = >=3.9
install_requires =
    yfinance>=0.2.31
    pandas>=2.0.0
    pyyaml>=6.0
    beautifulsoup4>=4.12.0
    requests>=2.31.0
    tabulate>=0.9.0
    pyarrow>=14.0.0
    lxml>=4.9.0

[options.extras_require]
dashboard =
    streamlit>=1.30.0
    plotly>=5.18.0

[options.entry_points]
console_scripts =
    screener = screener.cli:main

[options.package_data]
screener = configs/*.yaml

[options.packages.find]
include = screener*

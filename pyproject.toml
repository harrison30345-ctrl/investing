[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener"
version = "1.0.0"
description = "Fundamental stock screener for long-term investing and swing trading prep"
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.31",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "pyarrow>=14.0.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]

[project.scripts]
screener = "screener.cli:main"

[tool.setuptools.packages.find]
include = ["screener*"]

[tool.setuptools.package-data]
screener = ["configs/*.yaml"]
